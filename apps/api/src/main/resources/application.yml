spring:
  application:
    name: lume-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/lume}
    username: ${DATABASE_USER:lume}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_MAX:20}
      minimum-idle: ${DATABASE_POOL_MIN:4}
      connection-timeout: 3000
      validation-timeout: 1000
      max-lifetime: 1740000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        query:
          fail_on_pagination_over_collection_fetch: true
  flyway:
    enabled: true
    validate-migration-naming: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 2s
      connect-timeout: 2s
  session:
    store-type: redis
    redis:
      namespace: lume:session
      flush-mode: on-save
      repository-type: indexed
    timeout: 30m
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
  mvc:
    problemdetails:
      enabled: false
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/html
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    whitelabel:
      enabled: false
  servlet:
    session:
      cookie:
        name: LUME_SESSION
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax
        path: /
      timeout: 30m

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    root: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  structured:
    format:
      console: logstash

app:
  public-url: ${PUBLIC_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    mfa-encryption-key: ${MFA_ENCRYPTION_KEY:}
    login:
      maximum-sessions: ${MAXIMUM_SESSIONS:5}
      standard-session-seconds: 1800
      remembered-session-seconds: 2592000
  booking:
    zone-id: Europe/Lisbon
    maximum-days-ahead: 90
    cancellation-hours: 24
  mail:
    from: ${MAIL_FROM:no-reply@lumeatelier.pt}
    reset-base-url: ${PASSWORD_RESET_URL:http://localhost:3000/redefinir}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    totp-secret: ${BOOTSTRAP_ADMIN_TOTP_SECRET:}
    phone: ${BOOTSTRAP_ADMIN_PHONE:}
