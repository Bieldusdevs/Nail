services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: lume
      POSTGRES_USER: lume
      POSTGRES_PASSWORD: ${LOCAL_DATABASE_PASSWORD:?Define LOCAL_DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lume -d lume"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8.2-alpine
    environment:
      REDIS_PASSWORD: ${LOCAL_REDIS_PASSWORD:?Define LOCAL_REDIS_PASSWORD in .env}
    command:
      [
        "sh",
        "-c",
        'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"',
      ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    security_opt:
      - no-new-privileges:true

  api:
    profiles: ["app"]
    build:
      context: ./apps/api
    environment:
      SPRING_PROFILES_ACTIVE: local
      DATABASE_URL: jdbc:postgresql://postgres:5432/lume
      DATABASE_USER: lume
      DATABASE_PASSWORD: ${LOCAL_DATABASE_PASSWORD:?Define LOCAL_DATABASE_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${LOCAL_REDIS_PASSWORD:?Define LOCAL_REDIS_PASSWORD in .env}
      COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      SMTP_HOST: mailpit
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Define MFA_ENCRYPTION_KEY in .env}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
        NEXT_PUBLIC_DEMO_MODE: "false"
    environment:
      API_INTERNAL_URL: http://api:8080
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
